name: CI Social Command Center Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify package.json and baseline scripts
        run: |
          node -e "
          const pkg = require('./package.json');
          console.log('Valid package:', pkg.name, 'v' + pkg.version);
          "
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
